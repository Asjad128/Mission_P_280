
name: Windows IDD Driver Build

on:
  workflow_dispatch:

  push:
    paths:
      - '.github/workflows/windows-driver-build.yml'

permissions:
  contents: read

jobs:
  build-driver:
    name: Build Microsoft Indirect Display Driver
    runs-on: windows-2025

    steps:
      - name: Checkout Mission P280
        uses: actions/checkout@v4

      - name: Checkout pinned Microsoft driver sample
        uses: actions/checkout@v4
        with:
          repository: microsoft/Windows-driver-samples
          ref: d49bb7d72f3651952b2b6e4ad28d14fe2247eb69
          path: driver/upstream
          fetch-depth: 1
          sparse-checkout: |
            video/IndirectDisplay
            packages.config
            Directory.Build.props
          sparse-checkout-cone-mode: false

      - name: Add 480x800 portrait mode
        shell: pwsh
        run: |
          $base = "driver/upstream/video/IndirectDisplay/IddSampleDriver"
          $header = Join-Path $base "Driver.h"
          $source = Join-Path $base "Driver.cpp"

          function Replace-Once($content, $old, $new, $label) {
              if (-not $content.Contains($old)) {
                  throw "PATCH FAILED: Could not find $label"
              }
              return $content.Replace($old, $new)
          }

          # Read and normalize line endings
          $h = (Get-Content $header -Raw) -replace "`r`n", "`n"
          $cpp = (Get-Content $source -Raw) -replace "`r`n", "`n"

          # 1. Expand EDID-backed monitor mode arrays
          $h = Replace-Once $h `
              'static constexpr size_t szModeList = 3;' `
              'static constexpr size_t szModeList = 4;' `
              'monitor mode array size'

          # 2. Add portrait mode to the first EDID-backed monitor
          $cpp = Replace-Once $cpp `
              "            { 1024,  768,  60 },`n        },`n        0" `
              "            { 1024,  768,  60 },`n            {  480,  800,  60 },`n        },`n        0" `
              "first EDID monitor"

          # 3. Add portrait mode to the second EDID-backed monitor
          $cpp = Replace-Once $cpp `
              "            { 1024,  768,  60 },`n        },`n        0" `
              "            { 1024,  768,  60 },`n            {  480,  800,  60 },`n        },`n        0" `
              "second EDID monitor"

          # 4. Add portrait mode to EDID-less monitor defaults
          $cpp = Replace-Once $cpp `
              "    { 1024,  768, 75 },`n};" `
              "    { 1024,  768, 75 },`n    {  480,  800, 60 },`n};" `
              "EDID-less default modes"

          # 5. Add portrait mode to supported target modes
          $cpp = Replace-Once $cpp `
              "    TargetModes.push_back(CreateIddCxTargetMode(1024,  768, 60));" `
              "    TargetModes.push_back(CreateIddCxTargetMode(1024,  768, 60));`n    TargetModes.push_back(CreateIddCxTargetMode( 480,  800, 60));" `
              "target modes"

          Set-Content $header $h -NoNewline
          Set-Content $source $cpp -NoNewline

          Write-Host "Portrait mode patch applied successfully."

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Verify build environment
        shell: pwsh
        run: |
          Write-Host "===== MSBUILD ====="
          msbuild -version

          Write-Host "===== PROJECT ====="
          $project = "driver/upstream/video/IndirectDisplay/IddSampleDriver/IddSampleDriver.vcxproj"

          if (!(Test-Path $project)) {
              throw "IDD sample project not found."
          }

          Write-Host "Project found."

      - name: Restore WDK and SDK NuGet packages
        shell: pwsh
        working-directory: driver/upstream
        run: |
          nuget restore packages.config `
            -PackagesDirectory packages `
            -NonInteractive

          if ($LASTEXITCODE -ne 0) {
              throw "WDK NuGet restore failed."
          }

      - name: Install x86 WDK host tools
        shell: pwsh
        run: |
          nuget install Microsoft.Windows.WDK.x86 `
            -Version 10.0.28000.2526 `
            -OutputDirectory driver/upstream/packages `
            -NonInteractive

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to install x86 WDK package."
          }

      
      - name: Build IddSampleDriver x64 Debug
        shell: pwsh
        run: |
          $project = "driver/upstream/video/IndirectDisplay/IddSampleDriver/IddSampleDriver.vcxproj"

          $msbuildDefault = (Get-Command msbuild).Source
          $msbuild64 = Join-Path (Split-Path $msbuildDefault) "amd64\MSBuild.exe"

          if (!(Test-Path $msbuild64)) {
              throw "64-bit MSBuild executable not found: $msbuild64"
          }

          $stampInfDir = Join-Path $env:GITHUB_WORKSPACE "driver/upstream/packages/Microsoft.Windows.WDK.x64.10.0.28000.2526/c/bin/10.0.28000.0/x64"

          if (!(Test-Path "$stampInfDir/stampinf.exe")) {
              throw "x64 StampInf executable not found."
          }

          $env:PATH = "$stampInfDir;$env:PATH"

          Write-Host "===== MSBUILD EXECUTABLE ====="
          Write-Host $msbuild64

          Write-Host "===== BUILD ====="

          & $msbuild64 $project `
            -nologo `
            -m `
            -v:minimal `
            -p:Configuration=Debug `
            -p:Platform=x64 `
            -p:PreferredToolArchitecture=x64 `
            -p:StampInfToolPath="$stampInfDir" `
            "/flp:LogFile=driver-build.log;Verbosity=normal"

          if ($LASTEXITCODE -ne 0) {
              throw "IDD driver build failed."
          }

      
      - name: Verify build output
        shell: pwsh
        run: |
          $output = "driver/upstream/video/IndirectDisplay/IddSampleDriver/x64/Debug"

          Write-Host "===== BUILD OUTPUT ====="

          if (!(Test-Path $output)) {
              throw "Driver output directory not found."
          }

          Get-ChildItem $output -File |
            Select-Object Name, Length

          $dll = Join-Path $output "IddSampleDriver.dll"
          $inf = Join-Path $output "IddSampleDriver.inf"
          $cat = Join-Path $output "IddSampleDriver.cat"

          if (!(Test-Path $dll)) {
              throw "IddSampleDriver.dll was not generated."
          }

          if (!(Test-Path $inf)) {
              throw "IddSampleDriver.inf was not generated."
          }

          Write-Host "DLL and INF generated successfully."

          if (Test-Path $cat) {
              Write-Host "Catalog file generated."
          }
          else {
              Write-Host "Catalog file not generated."
          }


      - name: Upload driver build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IddSampleDriver-Debug-x64
          path: |
            driver/upstream/video/IndirectDisplay/IddSampleDriver/x64/Debug/**
            driver-build.log
          if-no-files-found: warn
          retention-days: 14
      
      - name: Extract driver mode implementation
        shell: pwsh
        run: |
          $file = "driver/upstream/video/IndirectDisplay/IddSampleDriver/Driver.cpp"
          $lines = Get-Content $file

          Write-Host "===== DRIVER INITIALIZATION (1-150) ====="
          for ($i = 0; $i -lt [Math]::Min(150, $lines.Length); $i++) {
              "{0,4}: {1}" -f ($i + 1), $lines[$i]
          }

          Write-Host "===== MONITOR MODE IMPLEMENTATION (640-810) ====="
      - name: Inspect monitor mode structures
        shell: pwsh
        run: |
          $base = "driver/upstream/video/IndirectDisplay/IddSampleDriver"

          Write-Host "===== Driver.h ====="
          Get-Content "$base/Driver.h"

          Write-Host "===== Monitor initialization ====="
          $file = "$base/Driver.cpp"
          $lines = Get-Content $file

          for ($i = 250; $i -lt [Math]::Min(450, $lines.Length); $i++) {
              "{0,4}: {1}" -f ($i + 1), $lines[$i]
          }
          for ($i = 639; $i -lt [Math]::Min(810, $lines.Length); $i++) {
              "{0,4}: {1}" -f ($i + 1), $lines[$i]
          }
