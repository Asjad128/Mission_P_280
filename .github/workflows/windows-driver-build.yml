
name: Windows IDD Driver Build

on:
  workflow_dispatch:

  push:
    paths:
      - '.github/workflows/windows-driver-build.yml'

permissions:
  contents: read

jobs:
  build-driver:
    name: Build Microsoft Indirect Display Driver
    runs-on: windows-2025

    steps:
      - name: Checkout Mission P280
        uses: actions/checkout@v4

      - name: Checkout pinned Microsoft driver sample
        uses: actions/checkout@v4
        with:
          repository: microsoft/Windows-driver-samples
          ref: d49bb7d72f3651952b2b6e4ad28d14fe2247eb69
          path: driver/upstream
          fetch-depth: 1
          sparse-checkout: |
            video/IndirectDisplay
            packages.config
            Directory.Build.props
          sparse-checkout-cone-mode: false

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Verify build environment
        shell: pwsh
        run: |
          Write-Host "MSBuild:"
          msbuild -version

          Write-Host "NuGet:"
          nuget help | Select-Object -First 3

          Write-Host "Sample project:"
          Test-Path "driver/upstream/video/IndirectDisplay/IddSampleDriver/IddSampleDriver.vcxproj"

      - name: Restore WDK and SDK NuGet packages
        shell: pwsh
        working-directory: driver/upstream
        run: |
          nuget restore packages.config `
            -PackagesDirectory packages `
            -NonInteractive

          if ($LASTEXITCODE -ne 0) {
              throw "WDK NuGet restore failed."
          }

      
      - name: Install x86 WDK components
        shell: pwsh
        run: |
          nuget install Microsoft.Windows.WDK.x86 `
            -Version 10.0.28000.2526 `
            -OutputDirectory driver/upstream/packages `
            -NonInteractive

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to install x86 WDK package."
          }

      - name: Inspect x86 WDK files and build targets
        shell: pwsh
        run: |
          $root = "driver/upstream/packages/Microsoft.Windows.WDK.x86.10.0.28000.2526"
          $targets = "driver/upstream/packages/Microsoft.Windows.WDK.x64.10.0.28000.2526/c/build/10.0.28000.0/WindowsDriver.common.targets"

          Write-Host "===== X86 PACKAGE DLL FILES ====="
          Get-ChildItem $root -Recurse -File -Filter "*.dll" |
            Select-Object -ExpandProperty FullName

          Write-Host "===== X86 PACKAGE EXE FILES ====="
          Get-ChildItem $root -Recurse -File -Filter "*.exe" |
            Select-Object -First 60 -ExpandProperty FullName

          Write-Host "===== X86 PACKAGE BUILD BIN CONTENTS ====="
          Get-ChildItem "$root/c/build/10.0.28000.0/bin" -Recurse -File -ErrorAction SilentlyContinue |
            Select-Object -First 60 -ExpandProperty FullName

          Write-Host "===== INFVERIF TARGET LOGIC ====="
          Select-String -Path $targets -Pattern "InfVerif" -Context 8,8

          Write-Host "===== PREFast TARGET REFERENCES ====="
          Get-ChildItem "driver/upstream/packages/Microsoft.Windows.WDK.x64.10.0.28000.2526/c" -Recurse -Include "*.targets","*.props" |
            Select-String -Pattern "WindowsPrefast|Prefast" |
            Select-Object -First 30

      - name: Inspect x86 WDK package layout
        shell: pwsh
        run: |
          $root = "driver/upstream/packages/Microsoft.Windows.WDK.x86.10.0.28000.2526"

          Write-Host "===== X86 PACKAGE FILES ====="
          Get-ChildItem $root -Recurse -File |
            Where-Object {
              $_.Name -match "InfVerif|WindowsPrefast|stampinf"
            } |
            Select-Object FullName, Length

          Write-Host "===== X86 BIN DIRECTORIES ====="
          Get-ChildItem "$root/c/bin/10.0.28000.0" -Directory -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName

          Write-Host "===== X86 BUILD DIRECTORIES ====="
          Get-ChildItem "$root/c/build/10.0.28000.0" -Directory -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName
     
      - name: Inspect WDK MSBuild tool references
        shell: pwsh
        run: |
          $targets = "driver/upstream/packages/Microsoft.Windows.WDK.x64.10.0.28000.2526/c/build/10.0.28000.0/WindowsDriver.common.targets"

          Write-Host "===== INFVERIF REFERENCES ====="
          Select-String -Path $targets -Pattern "InfVerif|InfVerif.dll" -Context 5,5

          Write-Host "===== PREFAST REFERENCES ====="
          Get-ChildItem "driver/upstream/packages/Microsoft.Windows.WDK.x64.10.0.28000.2526/c" -Recurse -Include "*.targets","*.props" |
            Select-String -Pattern "WindowsPrefast|Prefast" |
            Select-Object -First 30

      - name: Inspect INF verification and Prefast tools
        shell: pwsh
        run: |
          $packages = "driver/upstream/packages"

          Write-Host "===== INFVERIF DLL ====="
          Get-ChildItem $packages -Recurse -Filter InfVerif.dll |
            Select-Object -ExpandProperty FullName

          Write-Host "===== WINDOWS PREFAST DLL ====="
          Get-ChildItem $packages -Recurse -Filter WindowsPrefast.dll |
            Select-Object -ExpandProperty FullName

          Write-Host "===== X86 WDK PACKAGE ====="
          Get-ChildItem "$packages/Microsoft.Windows.WDK.x86*" -Directory |
            Select-Object -ExpandProperty FullName

      - name: Diagnose WDK tools
        shell: pwsh
        run: |
          Write-Host "===== SEARCHING FOR STAMPINF ====="

          $roots = @(
            "$env:GITHUB_WORKSPACE\driver\upstream\packages",
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin",
            "$env:ProgramFiles\Windows Kits\10\bin"
          )

          foreach ($root in $roots) {
            if (Test-Path $root) {
              Write-Host "Searching: $root"

              Get-ChildItem -Path $root `
                -Filter stampinf.exe `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -ExpandProperty FullName
            }
          }

          Write-Host "===== NUGET PACKAGES ====="

          Get-ChildItem "driver/upstream/packages" -Directory |
            Select-Object -ExpandProperty Name

          Write-Host "===== WDK ENVIRONMENT ====="

          Get-ChildItem Env: |
            Where-Object {
              $_.Name -match "WDK|SDK|Windows"
            } |
            Format-Table -AutoSize

      
      - name: Build IddSampleDriver x64 Debug
        if: false
        shell: pwsh
        run: |
          $project = "driver/upstream/video/IndirectDisplay/IddSampleDriver/IddSampleDriver.vcxproj"

          $stampInfDir = Join-Path $env:GITHUB_WORKSPACE "driver/upstream/packages/Microsoft.Windows.WDK.x64.10.0.28000.2526/c/bin/10.0.28000.0/x64"

          $stampInfExe = Join-Path $stampInfDir "stampinf.exe"

          Write-Host "Checking StampInf:"
          Write-Host $stampInfExe

          if (-not (Test-Path $stampInfExe)) {
              throw "stampinf.exe is missing from the expected x64 WDK package."
          }

          # Make StampInf discoverable by MSBuild.
          $env:PATH = "$stampInfDir;$env:PATH"

          Write-Host "StampInf version:"
          & $stampInfExe -?

          $logger = "/flp:logfile=$env:GITHUB_WORKSPACE\driver-build.log;verbosity=normal"

          msbuild $project `
            /m `
            /p:Configuration=Debug `
            /p:Platform=x64 `
            /p:SignMode=Off `
            "/p:StampInfToolPath=$stampInfDir" `
            /verbosity:minimal `
            /fl `
            $logger

          if ($LASTEXITCODE -ne 0) {
              throw "IddSampleDriver compilation failed."
          }

      - name: Verify build output
        if: false
        shell: pwsh
        run: |
          $output = "driver/upstream/video/IndirectDisplay/IddSampleDriver/x64/Debug"

          Write-Host "Build output:"
          Get-ChildItem $output -Recurse -File |
            Select-Object FullName, Length

          $dll = Get-ChildItem $output -Recurse -Filter "IddSampleDriver.dll"

          if (-not $dll) {
              throw "IddSampleDriver.dll was not generated."
          }

          Write-Host "Driver DLL generated successfully."

      - name: Upload driver build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IddSampleDriver-Debug-x64
          path: |
            driver/upstream/video/IndirectDisplay/IddSampleDriver/x64/Debug/**
            driver-build.log
          if-no-files-found: warn
          retention-days: 14
