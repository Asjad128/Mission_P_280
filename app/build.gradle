plugins {
    id 'com.android.application'
}

android {
    namespace 'com.voidcrew.micromaxdisplay'
    compileSdk 33

    defaultConfig {
        applicationId 'com.voidcrew.micromaxdisplay'
        minSdk 17
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }
}
